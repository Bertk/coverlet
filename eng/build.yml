steps:
- task: UseDotNet@2
  inputs:
    version: 8.0.421
  displayName: Install .NET Core SDK 8.0.421

- task: UseDotNet@2
  inputs:
    version: 9.0.315
  displayName: Install .NET Core SDK 9.0.315

- task: UseDotNet@2
  inputs:
    useGlobalJson: true
  displayName: Install .NET Core SDK (global.json)

# create artifact/package folder
- pwsh: |
    New-Item -ItemType Directory -Path artifacts/package/debug -Force
    New-Item -ItemType Directory -Path artifacts/package/release -Force
  displayName: create folder artifacts/package/$(BuildConfiguration)

# Authenticate Azure DevOps NuGet feed
- task: NuGetAuthenticate@1
  displayName: 'Authenticate Azure DevOps NuGet feed'
  inputs:
    forceReinstallCredentialProvider: true

- script: dotnet restore -v n -s "https://api.nuget.org/v3/index.json"
  displayName: Restore packages

- script: dotnet build -c $(BuildConfiguration) --no-restore -bl:build.msbuild.binlog
  displayName: Build

- script: dotnet pack -c $(BuildConfiguration) --no-restore
  displayName: Pack

# Run tests without coverage using dotnet exec
- pwsh: |
    function Invoke-TestAssembly {
        param(
            [Parameter(Mandatory = $true)]
            [string] $AssemblyPath,

            [Parameter(Mandatory = $true)]
            [string] $TrxFileName,

            [Parameter(Mandatory = $true)]
            [string] $DiagnosticPrefix
        )

        $badImageFormatPattern = 'Unhandled exception\. System\.BadImageFormatException:'

        $output = & dotnet exec $AssemblyPath `
            --diagnostic `
            --diagnostic-verbosity trace `
            --report-xunit-trx `
            --report-xunit-trx-filename $TrxFileName `
            --diagnostic-output-directory "$(Build.SourcesDirectory)/artifacts/log/" `
            --diagnostic-file-prefix $DiagnosticPrefix `
            --results-directory "$(Build.SourcesDirectory)/artifacts/reports/" `
            --no-progress 2>&1

        $output | ForEach-Object { Write-Host $_ }

        # if ($LASTEXITCODE -ne 0) {
        #   throw "Test host failed with exit code $LASTEXITCODE for $AssemblyPath"
        # }

        if (($output | Out-String) -match $badImageFormatPattern) {
            throw "Detected fatal IL instrumentation error in test output for $AssemblyPath."
        }
    }

    function Invoke-TestAssemblyIsolatedOnLinux {
        param(
            [Parameter(Mandatory = $true)]
            [string] $AssemblyPath,

            [Parameter(Mandatory = $true)]
            [string] $TrxFileName,

            [Parameter(Mandatory = $true)]
            [string] $DiagnosticPrefix
        )

        if ($env:AGENT_OS -ne 'Linux') {
            Invoke-TestAssembly $AssemblyPath $TrxFileName $DiagnosticPrefix
            return
        }

        $badImageFormatPattern = 'Unhandled exception\. System\.BadImageFormatException:'
        $listOutput = & dotnet exec $AssemblyPath --list-tests --no-progress 2>&1
        $listOutput | ForEach-Object { Write-Host $_ }

        # if ($LASTEXITCODE -ne 0) {
        #    throw "Test discovery failed with exit code $LASTEXITCODE for $AssemblyPath"
        #}

        $tests = $listOutput |
            ForEach-Object { $_.ToString().Trim() } |
            Where-Object { $_ } |
            Where-Object { $_ -notmatch '^The following tests are available' }

        foreach ($test in $tests) {
            Write-Host "Running isolated test: $test"

            $output = & dotnet exec $AssemblyPath `
                --filter-method "$test" `
                --diagnostic `
                --diagnostic-verbosity trace `
                --report-xunit-trx `
                --report-xunit-trx-filename $TrxFileName `
                --diagnostic-output-directory "$(Build.SourcesDirectory)/artifacts/log/" `
                --diagnostic-file-prefix $DiagnosticPrefix `
                --results-directory "$(Build.SourcesDirectory)/artifacts/reports/" `
                --no-progress 2>&1

            $output | ForEach-Object { Write-Host $_ }

            if ($LASTEXITCODE -ne 0) {
                throw "Isolated test host failed with exit code $LASTEXITCODE for test '$test' in $AssemblyPath"
            }

            if (($output | Out-String) -match $badImageFormatPattern) {
                throw "Detected fatal IL instrumentation error while running isolated test '$test' in $AssemblyPath."
            }
        }
    }

    $frameworks = "$(frameworks)".Split(",")
    foreach ($fw in $frameworks) {
        dotnet build-server shutdown
        Write-Host "Testing $fw"
        Invoke-TestAssembly "$(Build.SourcesDirectory)/artifacts/bin/coverlet.MTP.tests/$(BuildConfiguration)_${fw}/coverlet.MTP.tests.dll" "coverlet.MTP.tests.${fw}.trx" "coverlet.MTP.tests.${fw}_"
        dotnet build-server shutdown
        Invoke-TestAssembly "$(Build.SourcesDirectory)/artifacts/bin/coverlet.core.tests/$(BuildConfiguration)_${fw}/coverlet.core.tests.dll" "coverlet.core.tests.${fw}.trx" "coverlet.core.tests.${fw}_"
        dotnet build-server shutdown
        if (!$IsLinux)
        {
          dotnet exec "$(Build.SourcesDirectory)/artifacts/bin/coverlet.core.coverage.tests/$(BuildConfiguration)_${fw}/coverlet.core.coverage.tests.dll" --diagnostic --diagnostic-verbosity trace --report-xunit-trx --report-xunit-trx-filename "coverlet.core.coverage.tests.${fw}.trx" --diagnostic-output-directory "$(Build.SourcesDirectory)/artifacts/log/" --diagnostic-file-prefix "coverlet.core.coverage.tests.${fw}_" --results-directory "$(Build.SourcesDirectory)/artifacts/reports/" --no-progress
          dotnet build-server shutdown
        }
        dotnet exec "$(Build.SourcesDirectory)/artifacts/bin/coverlet.msbuild.tasks.tests/$(BuildConfiguration)_${fw}/coverlet.msbuild.tasks.tests.dll" --diagnostic --diagnostic-verbosity trace --report-xunit-trx --report-xunit-trx-filename "coverlet.msbuild.tasks.tests.${fw}.trx" --diagnostic-output-directory "$(Build.SourcesDirectory)/artifacts/log/" --diagnostic-file-prefix "coverlet.msbuild.tasks.tests.${fw}_" --results-directory "$(Build.SourcesDirectory)/artifacts/reports/" --no-progress
        dotnet build-server shutdown
        Invoke-TestAssembly "$(Build.SourcesDirectory)/artifacts/bin/coverlet.integration.tests/$(BuildConfiguration)_${fw}/coverlet.integration.tests.dll" "coverlet.integration.tests.${fw}.trx" "coverlet.integration.tests.${fw}_"
        dotnet build-server shutdown
        Invoke-TestAssembly "$(Build.SourcesDirectory)/artifacts/bin/coverlet.MTP.validation.tests/$(BuildConfiguration)_${fw}/coverlet.MTP.validation.tests.dll" "coverlet.MTP.validation.tests.${fw}.trx" "coverlet.MTP.validation.tests.${fw}_"
    }
  displayName: Run unit tests without coverage
  env:
    MSBUILDDISABLENODEREUSE: 1
    COVERLET_EXPERIMENTAL_AUTOPROP_BACKING_FIELD_CACHE: 1

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(Build.SourcesDirectory)'
    mergeTestResults: true
    publishRunAttachments: true
    failTaskOnFailedTests: true
    testRunTitle: $(Agent.OS)_$(BuildConfiguration)
  condition:  succeededOrFailed()

- template: publish-coverlet-result-files.yml

- script: |
    del coverlet.integration.determisticbuild\coverage.net8.0.cobertura.xml
    del coverlet.integration.determisticbuild\coverage.net9.0.cobertura.xml
    del coverlet.integration.determisticbuild\coverage.net10.0.cobertura.xml
    dir /s /B *.xml
  displayName: List XML files for test folder
  workingDirectory: "$(Build.SourcesDirectory)/test"
  condition: and(succeededOrFailed(), eq(variables['buildConfiguration'], 'debug'), eq(variables['agent.os'], 'Windows_NT'))
  enabled: false

